<body>
  <!-- Static form definition lets Netlify discover fields before Vue mounts. -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <select name="subject"><option value="general">General</option></select>
    <textarea name="message"></textarea>
  </form>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
